<!DOCTYPE html>
<html lang="en">
<head>

  <title>Sample Webpage</title>
  <link rel="stylesheet" href="dom.css">
</head>
<body>

  <header id="main-header">
    <h1 class="title">Welcome to My Website</h1>

  <main>

      <h2 class="section-title">About Us</h2>
      <p class="section-description">We are passionate about creating quality content for the web and making the internet a better place.</p>
    </section>
    <div id="img">
      <img src="" alt="">
    </div>
    <section id="services">
      <h2 class="section-title">Our Services</h2>
      <button class="serviceBtn" onclick="showService()">CLICK HERE to reveal services</button>
      <ul class="services-list">
        <li class="service-item">Web Development</li>
        <li class="service-item">Graphic Design</li>
        <li class="service-item">SEO Optimization</li>
      </ul>
    </section>

  <script src="script.js"></script>

</html>
